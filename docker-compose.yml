services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inuka_digital_africa
      POSTGRES_USER: inuka
      POSTGRES_PASSWORD: inuka_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inuka -d inuka_digital_africa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: